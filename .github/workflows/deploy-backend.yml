name: Verify Backend for Zeabur

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'zbpack.json'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Keep CI on the same Node major version as backend/Dockerfile. A passing
      # TypeScript build on a newer runner is not sufficient evidence that the
      # production image will run correctly.
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Run tests
        run: npx vitest run
        working-directory: backend

      - name: Build the Zeabur production image
        run: docker build --file backend/Dockerfile --tag oop-platform-backend:ci .

      - name: Zeabur deployment boundary
        run: |
          echo "Zeabur Git integration owns deployment for matching pushes."
          echo "This workflow verifies the same commit but is not a deployment gate."
          echo "Do not configure a Render deploy hook in this workflow."
