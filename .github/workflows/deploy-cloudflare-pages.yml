name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Optional HTTPS API URL for a one-off preview/canary build. Empty uses VITE_API_URL.'
        required: false
        type: string
      deployment_branch:
        description: 'Optional Cloudflare Pages branch for a one-off preview. Empty uses main/current PR branch.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # This remains inert until the repository variable is explicitly enabled.
    # GitHub Pages continues to deploy as the rollback artifact during canary.
    if: vars.CLOUDFLARE_PAGES_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      VITE_API_URL: ${{ inputs.api_url || vars.VITE_API_URL }}
      DEPLOY_BRANCH: ${{ inputs.deployment_branch || (github.event_name == 'pull_request' && github.head_ref || 'main') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate protected deployment settings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$CLOUDFLARE_PAGES_PROJECT" || (echo "Missing CLOUDFLARE_PAGES_PROJECT repository variable" && exit 1)
          test -n "$VITE_API_URL" || (echo "Missing VITE_API_URL repository variable" && exit 1)
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "VITE_API_URL must be an HTTPS API root" && exit 1 ;;
          esac

      - run: npm ci

      - name: Build SPA
        run: npm run build -w frontend

      - name: Deploy Pages artifact
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$DEPLOY_BRANCH"
